<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#183c35">
    <meta name="description" content="Offline-first GPS field log">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="stylesheet" href="style.css">
    <title>Field Log</title>
</head>
<body>
    <header>
        <div>
            <h1>Field Log V2.2</h1>
            <p id="status">Starting…</p>
        </div>
        <button id="install" hidden>Install</button>
    </header>

    <main>
        <section id="record">
            <label for="caption">Caption <small>(optional)</small></label>
            <textarea id="caption" rows="3"
                placeholder="What would you like to remember about this spot?"></textarea>

            <button id="log" class="primary">
                <b>＋</b><span id="log-label">LOG POSITION</span>
            </button>
            <p id="message" role="status">
                Press the button to record your current GPS position.
            </p>

            <div id="last" class="card" hidden>
                <small>LAST RECORDED POSITION</small>
                <div id="last-details"></div>
            </div>
        </section>

        <section id="log-screen" hidden>
            <div class="heading">
                <div>
                    <h2>Your log</h2>
                    <small id="count">0 entries</small>
                </div>
                <button id="back">Back</button>
            </div>

            <div class="exports">
                <button id="txt">Export TXT</button>
                <button id="csv">Export CSV</button>
            </div>

            <div class="upload-panel">
                <button id="upload" class="upload-button">Upload saved positions</button>
                <p id="upload-message" role="status">
                    Entries stay on this phone. Upload sends them to your server.
                </p>
            </div>

            <details class="settings" id="settings">
                <summary>Upload settings</summary>
                <label for="upload-endpoint">Server endpoint</label>
                <input id="upload-endpoint" type="url"
                    placeholder="https://example.com/server.php" autocomplete="url">
                <label for="device-id">Device ID</label>
                <input id="device-id" type="text" placeholder="Your FieldLog device ID"
                    autocomplete="off">
                <label for="storage-password">Storage Password</label>
                <input id="storage-password" type="text" placeholder="Storage password for your tenant"
                    autocomplete="off">
                <button id="save-settings">Save upload settings</button>
                <small>These settings are saved locally in this browser.</small>
            </details>

            <div id="entries"></div>
            <button id="clear" class="danger">Clear entire log…</button>
        </section>
    </main>

    <nav>
        <button id="nav-record" class="selected">＋ Record</button>
        <button id="nav-log">☷ Settings/View log <span id="nav-count">0</span></button>
    </nav>

    <script src="database.js?v=2.2"></script>
    <script src="app.js?v=2.2"></script>
</body>
</html>
